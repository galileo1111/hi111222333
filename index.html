<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für dich</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff5f5;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff4b5c;
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #text {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ff4b5c;
        }
    </style>
</head>
<body>

    <!-- Der Button -->
    <button onclick="zeigeNachricht()">drück</button>

    <!-- Hier erscheint der Text -->
    <div id="text"></div>

    <script>
        function zeigeNachricht() {
            document.getElementById("text").innerText = "Hab dich lieb";
        }
    </script>

</body>
</html>
